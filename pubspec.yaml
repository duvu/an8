name: an_nhien
description: "An Nhiên — dưỡng sinh mỗi ngày (Flutter MVP)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4
  # Pin Flutter stable minor; cập nhật có chủ đích và ghi vào TRACKER.md.
  flutter: ">=3.47.5 <3.48.0"

dependencies:
  an_brand:
    path: packages/an_brand
  an_nhien_cultural_content:
    path: packages/an_nhien_cultural_content
  an_nhien_eastern_content:
    path: packages/an_nhien_eastern_content
  audio_session: ^0.2.4
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^18.1.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqflite: ^2.4.4+2
  timezone: ^0.11.2
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.4
  crypto: ^3.0.7

flutter:
  uses-material-design: true
  generate: true
  # Dev-preview media only (frames + thumbnails); assets/source is never bundled.
  assets:
    - catalog/catalog.v1.json
    # Routine covers (Unified Media v0.7).
    - assets/covers/
    # UI sound cues (Media Kit v0.4; M4A plays on Android and iOS).
    - assets/audio/cues/
    - assets/audio/music/
    - assets/series/E01/thumbnail.png
    - assets/series/E01/frames/
    - assets/series/E02/thumbnail.png
    - assets/series/E02/frames/
    - assets/series/E03/thumbnail.png
    - assets/series/E03/frames/
    - assets/series/E04/thumbnail.png
    - assets/series/E04/frames/
    - assets/series/E05/thumbnail.png
    - assets/series/E05/frames/
    - assets/series/E06/thumbnail.png
    - assets/series/E06/frames/
    - assets/series/E07/thumbnail.png
    - assets/series/E07/frames/
