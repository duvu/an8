name: an_nhien_eastern_content
description: Draft Vietnamese Eastern qigong content catalogs and decorative media for An Nhien Flutter.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  # An Nhiên app shows introductions only (DECISIONS.md D09, D11): catalog metadata,
  # system covers and the listing cards that are specific to one form. Same-system
  # cards (coverIsExerciseSpecific=false) and step frames are not bundled.
  assets:
    - assets/catalog/
    - assets/covers/
    - assets/listing/E101_cover.webp
